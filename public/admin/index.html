<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1311">
<title>پنل سفارش‌ها</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="adm">
  <section id="login" class="login" hidden>
    <h1>پنل سفارش‌ها</h1>
    <form id="loginForm">
      <input class="in" id="pass" type="password" placeholder="رمز مدیریت" autocomplete="current-password" required>
      <button class="btn primary" type="submit">ورود</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </section>
  <section id="panel" hidden>
    <header class="top">
      <h1>سفارش‌ها <small id="count"></small></h1>
      <div class="tools">
        <button class="btn" id="refresh" type="button">به‌روزرسانی</button>
        <button class="btn" id="csv" type="button">خروجی CSV</button>
        <button class="btn" id="logout" type="button">خروج</button>
      </div>
    </header>
    <div class="filters">
      <select class="in" id="status" aria-label="فیلتر وضعیت"></select>
      <input class="in" id="q" type="search" placeholder="جستجو: نام، موبایل یا کد پیگیری">
    </div>
    <div id="list"></div>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
